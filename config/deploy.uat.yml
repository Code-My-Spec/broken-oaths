# Kamal config for broken_oaths UAT on the Hetzner UAT box (Nuremberg ARM).
# Run with: scripts/deploy-uat
#
# Same shape as deploy.yml; differs in host and arch. Service name
# matches deploy.yml so the multi-arch image labels resolve.

service: broken-oaths
image: broken-oaths

servers:
  web:
    hosts:
      - uat.broken-oaths.com
    options:
      network: db_net           # pre-attach so app can reach infra-postgres-1 at start
    proxy:                      # role-level override
      ssl: true
      host: uat.broken-oaths.com
      app_port: 4000
      healthcheck:
        path: /up

registry:
  server: 10.1.0.2:5000
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64
  local: true

# Container decrypts its own secrets from envs/uat.enc.env at boot via
# rel/overlays/bin/boot (sops exec-env), not AWS SSM. The only env Kamal
# carries is the age key + APP_ENV — everything else travels as
# ciphertext baked into the image.
env:
  clear:
    APP_ENV: uat
    PORT: "4000"
  secret:
    - SOPS_AGE_KEY

ssh:
  user: root
<% if ENV["CMS_SSH_KEY_PATH"] %>
  keys: ["<%= ENV["CMS_SSH_KEY_PATH"] %>"]
  keys_only: true
  log_level: debug
<% end %>
